name: Windows engine compatibility

on:
  push:
    branches: [feat/windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'ak5/symbiote-native'
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: microsoft/setup-msbuild@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Build the installable engine package
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 scripts/build-cli-entrypoints.test.mjs scripts/svelte-prepack.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsc --build core/engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory .windows-engine-packs | Out-Null
          pnpm --dir core/engine pack --pack-destination "$PWD/.windows-engine-packs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare installed framework consumers for Windows
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          node --test scripts/windows-app-fixtures.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run check:windows-consumers .windows-adapter-apps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create an isolated SDK compatibility fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory .windows-engine-probe | Out-Null
          @{
            name = 'symbiote-engine-probe'
            version = '0.0.0'
            private = $true
            dependencies = @{
              react = '19.2.3'
              'react-native' = '0.85.3'
              'react-native-windows' = '0.85.0'
            }
            devDependencies = @{
              '@react-native-community/cli' = '20.1.0'
              '@react-native/jest-preset' = '0.85.3'
              '@types/react' = '19.2.0'
            }
          } | ConvertTo-Json -Depth 5 | Set-Content .windows-engine-probe/package.json
      - name: Install the Windows SDK and create its standard native library
        working-directory: .windows-engine-probe
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          npm install --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install react-native init-windows --template cpp-lib --name SymbioteEngineProbe --namespace SymbioteEngineProbe --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 09e7d22e2d9bf97f9549c9f37759bf11758d62f0
          path: .windows-vcpkg
      - uses: actions/cache/restore@v4
        id: windows-dependencies
        with:
          path: .windows-vcpkg-cache
          key: windows-vs2026-static-md-folly-${{ hashFiles('core/engine/windows/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: windows-vs2026-static-md-folly-${{ hashFiles('core/engine/windows/vcpkg.json') }}-
      - name: Build pinned engine dependencies
        shell: pwsh
        env:
          VCPKG_MAX_CONCURRENCY: 2
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          New-Item -ItemType Directory -Force .windows-vcpkg-cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$PWD/.windows-vcpkg-cache,readwrite"
          & .windows-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .windows-vcpkg/vcpkg.exe install --triplet x64-windows-static-md "--x-manifest-root=$PWD/core/engine/windows" "--x-install-root=$PWD/.windows-vcpkg-installed" --x-buildtrees-root=C:/tbz-b --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.windows-dependencies.outputs.cache-primary-key != ''
        with:
          path: .windows-vcpkg-cache
          key: ${{ steps.windows-dependencies.outputs.cache-primary-key }}
      - name: Add the actual engine sources to the fixture
        shell: pwsh
        run: |
          & scripts/configure-windows-engine.ps1 -ProjectPath .windows-engine-probe/windows/SymbioteEngineProbe/SymbioteEngineProbe.vcxproj -ReactNativePath .windows-engine-probe/node_modules/react-native
      - name: Compile and link against the released Windows SDK
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $kitsRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdk = Get-ChildItem (Join-Path $kitsRoot 'Lib') -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' -and (Test-Path (Join-Path $_.FullName 'um/x64/kernel32.lib')) } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $sdk) { throw 'No installed Windows 10/11 SDK with x64 libraries found' }
          Write-Host "Using installed Windows SDK $($sdk.Name)"
          "SYMBIOTE_WINDOWS_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          msbuild .windows-engine-probe/windows/SymbioteEngineProbe.sln /restore /m:1 /p:Configuration=Debug /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$($sdk.Name)" /bl:windows-engine.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the production WinRT package provider
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $rnw = (Resolve-Path .windows-engine-probe/node_modules/react-native-windows).Path + '\'
          $rn = (Resolve-Path .windows-engine-probe/node_modules/react-native).Path + '\'
          $vcpkg = (Resolve-Path .windows-vcpkg).Path + '\'
          $installed = (Resolve-Path .windows-vcpkg-installed).Path + '\'
          msbuild core/engine/windows/SymbioteNativeEngine.sln /restore /m:1 /p:Configuration=Debug /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$env:SYMBIOTE_WINDOWS_SDK" "/p:ReactNativeWindowsDir=$rnw" "/p:SymbioteReactNativeDirectory=$rn" "/p:VcpkgRoot=$vcpkg" "/p:VcpkgInstalledDir=$installed" /p:VcpkgManifestInstall=false /bl:windows-package.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create a standard Windows application
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          New-Item -ItemType Directory .windows-fabric-probe | Out-Null
          $engineVersion = (Get-Content core/engine/package.json -Raw | ConvertFrom-Json).version
          @{
            name = 'symbiote-fabric-probe'
            version = '0.0.0'
            private = $true
            dependencies = @{
              react = '19.2.3'
              'react-native' = '0.85.3'
              'react-native-windows' = '0.85.0'
              '@symbiote-native/engine' = "file:../.windows-engine-packs/symbiote-native-engine-$engineVersion.tgz"
            }
            devDependencies = @{
              '@react-native-community/cli' = '20.1.0'
              '@react-native/community-cli-plugin' = '0.85.3'
              '@react-native/babel-preset' = '0.85.3'
              '@react-native/metro-config' = '0.85.3'
              '@react-native/jest-preset' = '0.85.3'
              '@types/react' = '19.2.0'
            }
          } | ConvertTo-Json -Depth 5 | Set-Content .windows-fabric-probe/package.json
          Push-Location .windows-fabric-probe
          npm install --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install react-native init-windows --template cpp-app --name SymbioteFabricProbe --namespace SymbioteFabricProbe --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Register the SDK-only native probe
        shell: pwsh
        run: |
          $projectDir = '.windows-fabric-probe/windows/SymbioteFabricProbe'
          Copy-Item core/engine/windows/tests/FabricProbe.h $projectDir
          Copy-Item core/engine/cpp/SymbioteBuffer.h $projectDir
          Copy-Item core/engine/windows/tests/index.windows.js .windows-fabric-probe
          Copy-Item core/engine/windows/tests/babel.config.cjs .windows-fabric-probe
          $sourcePath = Join-Path $projectDir 'SymbioteFabricProbe.cpp'
          $source = Get-Content $sourcePath -Raw
          $registration = 'AddAttributedModules(packageBuilder, true);'
          if (-not $source.Contains($registration)) { throw 'The SDK template registration changed' }
          $source = $source.Replace('#include "NativeModules.h"', "#include `"NativeModules.h`"`n#include <TurboModuleProvider.h>`n#include `"FabricProbe.h`"")
          $source = $source.Replace($registration, $registration + "`n" + 'winrt::Microsoft::ReactNative::AddTurboModuleProvider<symbiote::windows::probe::FabricProbe>(packageBuilder, L"SymbioteFabricProbe");')
          Set-Content $sourcePath $source
      - name: Autolink the production native package into the application
        shell: pwsh
        run: |
          Copy-Item core/engine/windows/tests/index-engine.windows.js .windows-fabric-probe/index.windows.js
          Copy-Item core/engine/windows/tests/engine-smoke.js .windows-fabric-probe
          Push-Location .windows-fabric-probe
          npx --no-install react-native autolink-windows --logging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Build the bundled Win32 application
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $kitsRoot = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $sdk = Get-ChildItem (Join-Path $kitsRoot 'Lib') -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.0$' -and (Test-Path (Join-Path $_.FullName 'um/x64/kernel32.lib')) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($null -eq $sdk) { throw 'No installed x64 Windows SDK found' }
          $rnw = (Resolve-Path .windows-fabric-probe/node_modules/react-native-windows).Path + '\'
          $rn = (Resolve-Path .windows-fabric-probe/node_modules/react-native).Path + '\'
          $vcpkg = (Resolve-Path .windows-vcpkg).Path + '\'
          $installed = (Resolve-Path .windows-vcpkg-installed).Path + '\'
          msbuild .windows-fabric-probe/windows/SymbioteFabricProbe.sln /restore /t:SymbioteFabricProbe /m:1 /p:Configuration=Release /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$($sdk.Name)" /p:UseBundle=true /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true '/p:BundlerExtraArgs=--max-workers 1' "/p:ReactNativeWindowsDir=$rnw" "/p:SymbioteReactNativeDirectory=$rn" "/p:VcpkgRoot=$vcpkg" "/p:VcpkgInstalledDir=$installed" /p:VcpkgManifestInstall=false /bl:windows-fabric.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Fabric through the ABI runtime
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $executables = @(Get-ChildItem .windows-fabric-probe/windows -Recurse -Filter SymbioteFabricProbe.exe)
          if ($executables.Count -ne 1) { throw "Expected one native app, found $($executables.Count)" }
          $logPath = Join-Path $executables[0].DirectoryName 'windows-fabric-runtime.log'
          $app = Start-Process $executables[0].FullName -WorkingDirectory $executables[0].DirectoryName -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '' }
            } while (-not $app.HasExited -and $log -notmatch '(PASS|FAIL):' -and (Get-Date) -lt $deadline)
            Write-Host $log
            if ($log -match 'FAIL:' -or $log -notmatch 'PASS: NativeState, shared command buffer, Fabric create/clone/commit/measure 120->240') {
              throw "Native Windows Fabric probe did not pass; exited=$($app.HasExited)"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Run each framework through native Windows layout and typing
        shell: pwsh
        run: |
          (Get-Process -Id $PID).PriorityClass = 'BelowNormal'
          $executables = @(Get-ChildItem .windows-fabric-probe/windows -Recurse -Filter SymbioteFabricProbe.exe)
          if ($executables.Count -ne 1) { throw "Expected one native app, found $($executables.Count)" }
          $executable = $executables[0]
          $bundle = Join-Path $executable.DirectoryName 'Bundle/index.windows.bundle'
          if (-not (Test-Path $bundle)) { throw "Missing packaged JavaScript bundle: $bundle" }
          foreach ($framework in @('react', 'svelte', 'vue', 'solid', 'angular')) {
            Copy-Item ".windows-adapter-apps/$framework/index.windows.bundle" $bundle -Force
            $logPath = Join-Path $executable.DirectoryName 'windows-fabric-runtime.log'
            Remove-Item $logPath -ErrorAction SilentlyContinue
            $app = Start-Process $executable.FullName -WorkingDirectory $executable.DirectoryName -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(90)
              do {
                Start-Sleep -Milliseconds 500
                $app.Refresh()
                $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '' }
              } while (-not $app.HasExited -and $log -notmatch '(PASS|FAIL):' -and (Get-Date) -lt $deadline)
              Write-Host $log
              if (Test-Path $logPath) { Copy-Item $logPath "windows-$framework-runtime.log" }
              $title = $framework.Substring(0, 1).ToUpperInvariant() + $framework.Substring(1)
              if ($log -match 'FAIL:' -or -not $log.Contains("PASS: $title native layout 120->240")) {
                throw "$title did not complete native layout and reactive update; exited=$($app.HasExited)"
              }
              powershell.exe -NoProfile -File ./scripts/check-windows-native-input.ps1 -ApplicationProcessId $app.Id |
                Tee-Object -FilePath "windows-$framework-input-runtime.log"
              if ($LASTEXITCODE -ne 0) { throw "$title native input verification failed" }
              $log = Get-Content $logPath -Raw
              Copy-Item $logPath "windows-$framework-runtime.log" -Force
              if ($log -match 'FAIL:') { throw "$title failed during native typing: $log" }
            } finally {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-engine-build-log
          include-hidden-files: true
          path: |
            windows-engine.binlog
            windows-package.binlog
            windows-*-runtime.log
            windows-fabric.binlog
            .windows-fabric-probe/windows/**/windows-fabric-runtime.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-dependency-build-log
          path: C:/tbz-b/**/*.log
          if-no-files-found: ignore
