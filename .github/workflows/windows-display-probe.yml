name: Windows display controls

on:
  push:
    branches: [feat/windows]
    paths:
      - .github/workflows/windows-display-probe.yml
      - scripts/check-windows-display-scaling.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-display-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.repository == 'ak5/symbiote-native'
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native Windows display scaling controls
        shell: pwsh
        run: |
          & ./scripts/check-windows-display-scaling.ps1 -OutputDirectory windows-display-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-display-controls
          path: windows-display-probe/
