name: Linux engine integration

on:
  push:
    branches: [feat/linux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'ak5/symbiote-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-18
      CXX: clang++-18
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: react-native-linux/react-native-linux
          ref: 4db5e336b529c15628ffb8ba94cd6d880ff9a450
          path: .linux-host
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install compiler dependencies
        run: |
          sudo nice -n 10 apt-get update
          sudo nice -n 10 apt-get install -y ccache patch clang-18 cmake ninja-build pkg-config libboost-dev libdouble-conversion-dev libfmt-dev libgoogle-glog-dev libcurl4-openssl-dev libsqlite3-dev libxkbcommon-dev libicu-dev libwayland-dev libgtest-dev clang-format-18 sway wl-clipboard wtype wayland-protocols libwayland-bin
      - name: Apply the pinned Linux host changes
        run: |
          test "$(git -C .linux-host rev-parse HEAD)" = 4db5e336b529c15628ffb8ba94cd6d880ff9a450
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/clipboard-safety.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/clipboard-safety.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/system-clipboard.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/system-clipboard.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/layout-conformance.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/layout-conformance.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/accessibility.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/accessibility.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/custom-actions.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/custom-actions.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/lifecycle-cleanup.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/lifecycle-cleanup.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/modal.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/modal.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/refresh.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/refresh.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/selection.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/selection.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/input-driver-cleanup.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/input-driver-cleanup.patch"
          git -C .linux-host apply --check "$PWD/core/engine/linux/host/rust-sanitizers.patch"
          git -C .linux-host apply "$PWD/core/engine/linux/host/rust-sanitizers.patch"
      - name: Check native accessibility source formatting
        run: |
          nice -n 10 clang-format-18 --dry-run --Werror .linux-host/packages/core/src/AccessibilityBridge.cpp .linux-host/packages/core/src/AccessibilityBridge.h .linux-host/packages/core/src/EditorModel.cpp .linux-host/packages/core/src/EditorModel.h .linux-host/packages/core/src/RetainedScene.cpp .linux-host/packages/core/src/RetainedScene.h .linux-host/packages/core/src/LinuxMountingManager.cpp .linux-host/packages/core/src/LinuxMountingManager.h .linux-host/packages/core/src/InputDispatcher.cpp .linux-host/packages/core/src/InputDispatcher.h .linux-host/packages/core/src/FabricHost.h .linux-host/packages/core/src/WindowSession.cpp .linux-host/packages/core/src/WindowSession.h .linux-host/packages/core/src/WindowMain.cpp .linux-host/packages/core/tests/{AccessibilitySnapshotTest,NativeAccessibilityActionTest,EditorTest}.cpp
      - name: Check native modal source formatting
        run: nice -n 10 clang-format-18 --dry-run --Werror .linux-host/packages/core/src/{ModalController.cpp,ModalController.h,ShadowNodeLookup.h,ScrollController.cpp,ScrollController.h,FantomTester.cpp,FantomTester.h} .linux-host/packages/core/tests/{ModalControllerTest.cpp,ModalSceneTest.cpp} .linux-host/packages/core/tests/hermes/ModalHostTest.cpp
      - name: Check native refresh source formatting
        run: nice -n 10 clang-format-18 --dry-run --Werror .linux-host/packages/core/src/{RefreshGesture.cpp,RefreshGesture.h,InputInjector.cpp} .linux-host/packages/core/tests/{RefreshGestureTest.cpp,RefreshSceneTest.cpp,RefreshControllerTest.cpp} .linux-host/packages/core/tests/hermes/RefreshHostTest.cpp
      - name: Check the standalone clipboard backend
        run: |
          nice -n 10 clang-format-18 --dry-run --Werror .linux-host/packages/core/src/{Clipboard.cpp,Clipboard.h,ClipboardText.h,WaylandClipboard.cpp,WaylandClipboard.h,WaylandSeat.cpp,WaylandSeat.h,WaylandWindow.cpp,WaylandWindow.h,TextInputController.cpp,TextInputController.h,TurboModuleRegistry.cpp,FabricHost.cpp,LayoutConformanceComponent.h} .linux-host/packages/core/tests/ClipboardBackendTest.cpp .linux-host/packages/core/tests/TextInputControllerTest.cpp .linux-host/packages/core/tests/hermes/{ClipboardModuleTest.cpp,LayoutConformanceHostTest.cpp}
          nice -n 10 clang++-18 -std=c++20 -Wall -Wextra -Werror -pthread -I .linux-host/packages/core/src .linux-host/packages/core/src/Clipboard.cpp .linux-host/packages/core/src/WaylandClipboard.cpp .linux-host/packages/core/tests/ClipboardBackendTest.cpp -lwayland-client -lgtest -lgtest_main -o .linux-host/clipboard-checks
          nice -n 10 timeout 60s .linux-host/clipboard-checks
      - name: Verify clipboard exchange with independent native clients
        run: |
          set -euo pipefail
          mkdir .linux-host/clipboard-protocol
          protocol="$PWD/.linux-host/clipboard-protocol"
          source="$PWD/.linux-host/packages/core/src"
          wayland-scanner client-header /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml "$protocol/xdg-shell-client-protocol.h"
          wayland-scanner private-code /usr/share/wayland-protocols/stable/xdg-shell/xdg-shell.xml "$protocol/xdg-shell-protocol.c"
          nice -n 10 clang-format-18 --style=file:.linux-host/.clang-format --dry-run --Werror core/engine/linux/tests/wayland-clipboard-probe.cpp
          for variant in normal asan tsan; do
            flags=()
            if [ "$variant" = asan ]; then flags=('-fsanitize=address,undefined' -fno-omit-frame-pointer); fi
            if [ "$variant" = tsan ]; then
              flags=(-fsanitize=thread -fno-omit-frame-pointer)
              # Clang 18's TSan shadow mapping needs this ASLR width on the disposable runner.
              sudo sysctl -w vm.mmap_rnd_bits=28
            fi
            nice -n 10 clang-18 -g -O1 "${flags[@]}" -I "$protocol" -c "$protocol/xdg-shell-protocol.c" -o "$protocol/$variant.o"
            nice -n 10 clang++-18 -std=c++20 -g -O1 -Wall -Wextra -Werror -pthread "${flags[@]}" -I "$source" -I "$protocol" "$source/Clipboard.cpp" "$source/WaylandClipboard.cpp" core/engine/linux/tests/wayland-clipboard-probe.cpp "$protocol/$variant.o" -lwayland-client -lxkbcommon -o "$protocol/$variant"
            nice -n 10 env ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 TSAN_OPTIONS=halt_on_error=1 node scripts/check-linux-system-clipboard.mjs "$protocol/$variant" "$protocol/results-$variant"
          done
      - name: Install JavaScript dependencies
        run: |
          nice -n 10 pnpm install --frozen-lockfile --ignore-scripts
          nice -n 10 pnpm --dir .linux-host install --frozen-lockfile --ignore-scripts
      - name: Generate native registration from the package configuration
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('core/engine');
          const config = require(path.join(root, 'react-native.config.cjs'));
          fs.writeFileSync('.linux-host/symbiote-config.json', JSON.stringify({
            root: process.cwd(),
            dependencies: { '@symbiote-native/engine': { root, platforms: config.dependency.platforms } },
          }));
          NODE
          nice -n 10 node .linux-host/scripts/autolink.ts .linux-host/symbiote-config.json .linux-host/symbiote-generated
          nice -n 10 pnpm exec esbuild core/engine/linux/tests/native-smoke.ts --bundle --platform=neutral --main-fields=module,main --format=iife --define:__DEV__=true '--define:process.env.NODE_ENV="development"' --outfile=.linux-host/symbiote-smoke.js
      - name: Fetch the host's pinned React Native source
        run: nice -n 10 node .linux-host/scripts/vendor-react-native.ts
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ~/.cache/ccache
          key: linux-engine-4db5e33-${{ github.sha }}
          restore-keys: linux-engine-4db5e33-
      - name: Compile the native host and Symbiote engine
        id: native-build
        run: |
          nice -n 10 cmake -S .linux-host -B .linux-host/build/symbiote -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DRNL_ENABLE_SKIA=OFF -DRNL_AUTOLINKING_CMAKE="$PWD/.linux-host/symbiote-generated/rnl_autolinking.cmake"
          nice -n 10 cmake --build .linux-host/build/symbiote --target hello_react --parallel 2
      - name: Verify native text, layout and accessibility regressions
        run: |
          set -o pipefail
          nice -n 10 cmake --build .linux-host/build/symbiote --target rnl_core_hermes_tests --parallel 2
          nice -n 10 ctest --test-dir .linux-host/build/symbiote --show-only -R '^Refresh(Gesture|Scene|Controller|Host)Test\.' | tee .linux-host/symbiote-refresh-discovery.log
          grep -Fx 'Total Tests: 39' .linux-host/symbiote-refresh-discovery.log
          nice -n 10 ctest --test-dir .linux-host/build/symbiote --verbose --output-on-failure --no-tests=error --timeout 60 -j 1 -R '^(TextInputControllerTest|ClipboardBackendTest|ClipboardTextTest|ClipboardModuleTest|LayoutConformanceHostTest|AccessibilitySnapshotTest|NativeAccessibilityActionTest|EditorModelTest|ModalControllerTest|ModalSceneTest|ModalHostTest|RefreshGestureTest|RefreshSceneTest|RefreshControllerTest|RefreshHostTest)\.' 2>&1 | tee .linux-host/symbiote-host-clipboard.log
      - name: Exercise module initialization and Fabric commits in Hermes
        run: |
          set -o pipefail
          nice -n 10 .linux-host/build/symbiote/bin/hello_react --fabric .linux-host/symbiote-smoke.js 2>&1 | tee .linux-host/symbiote-smoke.log
          grep -F 'Symbiote Linux engine smoke passed' .linux-host/symbiote-smoke.log
      - name: Build a Metro application from packed packages
        run: |
          nice -n 10 node --test --test-concurrency=1 scripts/linux-consumer-bundle.test.mjs scripts/linux-sanitizer-builds.test.mjs
          nice -n 10 node scripts/prepare-linux-consumer.mjs .linux-host .linux-host/symbiote-app
      - name: Run the packaged application in the native host
        run: |
          set -o pipefail
          for framework in react svelte vue solid angular; do
            log=".linux-host/symbiote-$framework.log"
            nice -n 10 .linux-host/build/symbiote/bin/hello_react --fabric ".linux-host/symbiote-app/$framework/index.linux.bundle.js" 2>&1 | tee "$log"
            grep -F "Symbiote Linux ${framework^} app updated" "$log"
            grep -F 'frame=(0.00, 0.00, 240.00, 80.00)' "$log"
            if grep -F 'has no native component registered' "$log"; then exit 1; fi
          done
      - name: Install window dependencies
        run: |
          sudo nice -n 10 apt-get install -y libfontconfig-dev libfreetype-dev libvulkan-dev libwayland-dev mesa-vulkan-drivers wayland-protocols cage at-spi2-core python3-gi python3-pil gir1.2-atspi-2.0 libglib2.0-bin dbus-daemon
          nice -n 10 node .linux-host/scripts/vendor-skia.ts
          nice -n 10 node .linux-host/scripts/vendor-fonts.ts
      - name: Register the installed engine for native window verification
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const app = path.resolve('.linux-host/symbiote-app/react');
          const root = path.join(app, 'node_modules/@symbiote-native/engine');
          const config = require(path.join(root, 'react-native.config.cjs'));
          fs.writeFileSync('.linux-host/symbiote-config.json', JSON.stringify({
            root: app,
            dependencies: { '@symbiote-native/engine': { root, platforms: config.dependency.platforms } },
          }));
          NODE
          nice -n 10 node .linux-host/scripts/autolink.ts .linux-host/symbiote-config.json .linux-host/symbiote-generated
      - name: Build the native window and input driver
        run: |
          rustc --version
          cargo --version
          nice -n 10 cmake -S .linux-host -B .linux-host/build/symbiote -DRNL_ENABLE_SKIA=ON -DRNL_ENABLE_WINDOW=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('.linux-host/symbiote-app/react/node_modules/@symbiote-native/engine');
          const commands = JSON.parse(fs.readFileSync('.linux-host/build/symbiote/compile_commands.json', 'utf8'));
          const sources = new Set(commands
            .map(({ directory, file }) => path.resolve(directory, file))
            .filter(file => fs.existsSync(file))
            .map(file => fs.realpathSync(file)));
          for (const file of ['linux/SymbioteEngineModule.cpp', 'cpp/SymbioteEngineBindings.cpp']) {
            const source = fs.realpathSync(path.join(root, file));
            assert(sources.has(source), `Native window must compile the installed engine: ${source}`);
            console.log(`Installed engine native source: ${source}`);
          }
          NODE
          nice -n 10 cmake --build .linux-host/build/symbiote --target rnl_accessibility_transport_tests --parallel 2
          nice -n 10 cmake --build .linux-host/build/symbiote --target rnl_accessibility_ownership_tests --parallel 2
          nice -n 10 cmake --build .linux-host/build/symbiote --target rnl_window rnl_inject --parallel 2
          # The host's existing e2e harness locates its executables under build/dev.
          ln -s symbiote .linux-host/build/dev
      - name: Verify accessibility through an independent AT-SPI client
        run: |
          set -o pipefail
          nice -n 10 /usr/bin/python3 scripts/check-linux-accessibility.py .linux-host/build/symbiote/bin/rnl_window .linux-host/symbiote-app/react/accessibility.linux.bundle.js .linux-host/accessibility-results 2>&1 | tee .linux-host/symbiote-accessibility.log
      - name: Exercise native keyboard, clipboard, resize and scrolling in each application
        run: nice -n 10 node scripts/run-linux-window-consumers.mjs .linux-host .linux-host/symbiote-app
      - name: Verify native modals in every framework
        run: |
          set -o pipefail
          failed=0
          for framework in react svelte vue solid angular; do
            nice -n 10 /usr/bin/python3 scripts/check-linux-accessibility.py .linux-host/build/symbiote/bin/rnl_window ".linux-host/symbiote-app/$framework/modal.linux.bundle.js" ".linux-host/modal-$framework-results" --scenario modal 2>&1 | tee ".linux-host/symbiote-modal-$framework.log" || failed=1
          done
          exit "$failed"
      - name: Verify native refresh in every framework
        run: |
          set -o pipefail
          failed=0
          for framework in react svelte vue solid angular; do
            nice -n 10 /usr/bin/python3 scripts/check-linux-accessibility.py .linux-host/build/symbiote/bin/rnl_window ".linux-host/symbiote-app/$framework/refresh.linux.bundle.js" ".linux-host/refresh-$framework-results" --scenario refresh 2>&1 | tee ".linux-host/symbiote-refresh-$framework.log" || failed=1
          done
          exit "$failed"
      - name: Verify native library persistence across application relaunches
        run: |
          nice -n 10 node --test scripts/linux-persistence-probe.test.mjs
          nice -n 10 node scripts/run-linux-persistence-consumers.mjs .linux-host .linux-host/symbiote-app
      - uses: actions/upload-artifact@v4
        with:
          name: linux-accessibility-bundle
          include-hidden-files: true
          path: |
            .linux-host/symbiote-app/react/accessibility.linux.bundle.js
            .linux-host/symbiote-app/react/modal.linux.bundle.js
            .linux-host/symbiote-app/react/refresh.linux.bundle.js
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-engine-runtime-logs
          include-hidden-files: true
          path: |
            .linux-host/symbiote-*.log
            .linux-host/build/e2e
            .linux-host/clipboard-protocol/results-*
            .linux-host/accessibility-results
            .linux-host/modal-*-results
            .linux-host/refresh-*-results
          if-no-files-found: ignore

  accessibility-sanitizers:
    needs: native
    if: github.repository == 'ak5/symbiote-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sanitizer: [asan, tsan]
    env:
      CC: clang-18
      CXX: clang++-18
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_MAXSIZE: 2G
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: react-native-linux/react-native-linux
          ref: 4db5e336b529c15628ffb8ba94cd6d880ff9a450
          path: .linux-host
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          name: linux-accessibility-bundle
          path: .linux-accessibility
      - name: Install native compiler and accessibility dependencies
        run: |
          sudo nice -n 10 apt-get update
          sudo nice -n 10 apt-get install -y ccache patch clang-18 cmake ninja-build pkg-config libboost-dev libdouble-conversion-dev libfmt-dev libgoogle-glog-dev libcurl4-openssl-dev libsqlite3-dev libxkbcommon-dev libicu-dev libwayland-dev libfontconfig-dev libfreetype-dev libvulkan-dev mesa-vulkan-drivers wayland-protocols sway wtype at-spi2-core python3-gi python3-pil gir1.2-atspi-2.0 libglib2.0-bin dbus-daemon
          if [ "${{ matrix.sanitizer }}" = tsan ]; then
            # Match the shadow mapping used by the independent clipboard TSan gate.
            sudo sysctl -w vm.mmap_rnd_bits=28
            sudo nice -n 10 apt-get install -y python3-venv python3-mako python3-yaml python3-packaging llvm-19-dev libdrm-dev libelf-dev libexpat1-dev libzstd-dev bison flex glslang-tools
          fi
      - name: Install pinned Rust sanitizer toolchain and standard library sources
        run: nice -n 10 rustup toolchain install nightly-2026-10-29 --profile minimal --component rust-src
      - name: Apply the pinned Linux host changes
        run: |
          test "$(git -C .linux-host rev-parse HEAD)" = 4db5e336b529c15628ffb8ba94cd6d880ff9a450
          for patch in clipboard-safety system-clipboard layout-conformance accessibility custom-actions lifecycle-cleanup modal refresh selection input-driver-cleanup rust-sanitizers; do
            git -C .linux-host apply --check "$PWD/core/engine/linux/host/$patch.patch"
            git -C .linux-host apply "$PWD/core/engine/linux/host/$patch.patch"
          done
      - name: Prepare the native host and engine registration
        run: |
          nice -n 10 pnpm --dir .linux-host install --frozen-lockfile --ignore-scripts
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('core/engine');
          const config = require(path.join(root, 'react-native.config.cjs'));
          fs.writeFileSync('.linux-host/symbiote-config.json', JSON.stringify({
            root: process.cwd(),
            dependencies: { '@symbiote-native/engine': { root, platforms: config.dependency.platforms } },
          }));
          NODE
          nice -n 10 node .linux-host/scripts/autolink.ts .linux-host/symbiote-config.json .linux-host/symbiote-generated
          nice -n 10 node .linux-host/scripts/vendor-react-native.ts
          nice -n 10 node .linux-host/scripts/vendor-skia.ts
          nice -n 10 node .linux-host/scripts/vendor-fonts.ts
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ~/.cache/ccache
          key: linux-accessibility-${{ matrix.sanitizer }}-4db5e33-${{ github.sha }}
          restore-keys: linux-accessibility-${{ matrix.sanitizer }}-4db5e33-
      - name: Build the pinned Skia with matching sanitizers and RTTI
        run: nice -n 10 python3 scripts/build-linux-skia.py .linux-host "${{ matrix.sanitizer }}"
      - name: Build instrumented lavapipe without sanitizer exclusions
        if: matrix.sanitizer == 'tsan'
        run: |
          nice -n 10 python3 -m venv --system-site-packages .linux-host/build/mesa-tools
          nice -n 10 .linux-host/build/mesa-tools/bin/pip install meson==1.9.2
          nice -n 10 env PATH="$PWD/.linux-host/build/mesa-tools/bin:$PATH" CC="ccache $CC" CXX="ccache $CXX" python3 scripts/build-linux-lavapipe.py .linux-host
          echo "VK_DRIVER_FILES=$PWD/.linux-host/build/lavapipe-tsan/driver.json" >> "$GITHUB_ENV"
      - name: Build the real native window with sanitizers
        working-directory: .linux-host
        run: |
          nice -n 10 cmake --preset "${{ matrix.sanitizer }}" -DRust_TOOLCHAIN=nightly-2026-10-29 -DRNL_ENABLE_SKIA=ON -DRNL_ENABLE_WINDOW=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DRNL_AUTOLINKING_CMAKE="$GITHUB_WORKSPACE/.linux-host/symbiote-generated/rnl_autolinking.cmake"
          nice -n 10 cmake --build --preset "${{ matrix.sanitizer }}" --target rnl_window rnl_inject --parallel 2
      - name: Verify Rust sanitizer instrumentation
        run: |
          nice -n 10 nm --undefined-only ".linux-host/build/${{ matrix.sanitizer }}/_deps/accesskit_c-build/libaccesskit.a" > ".linux-host/symbiote-rust-${{ matrix.sanitizer }}-symbols.log"
          if [ "${{ matrix.sanitizer }}" = tsan ]; then
            grep -E '__tsan_atomic(8|16|32|64|128)_' .linux-host/symbiote-rust-tsan-symbols.log
          else
            grep -E '__asan_(load|store|report)' .linux-host/symbiote-rust-asan-symbols.log
          fi
      - name: Exercise the actual accessibility app, reload and stale handles
        run: |
          set -o pipefail
          nice -n 10 /usr/bin/python3 scripts/check-linux-accessibility.py ".linux-host/build/${{ matrix.sanitizer }}/bin/rnl_window" .linux-accessibility/accessibility.linux.bundle.js ".linux-host/accessibility-${{ matrix.sanitizer }}-results" 2>&1 | tee ".linux-host/symbiote-accessibility-${{ matrix.sanitizer }}.log"
      - name: Exercise native modal and refresh ownership with sanitizers
        run: |
          set -o pipefail
          failed=0
          for scenario in modal refresh; do
            nice -n 10 /usr/bin/python3 scripts/check-linux-accessibility.py ".linux-host/build/${{ matrix.sanitizer }}/bin/rnl_window" ".linux-accessibility/$scenario.linux.bundle.js" ".linux-host/$scenario-${{ matrix.sanitizer }}-results" --scenario "$scenario" 2>&1 | tee ".linux-host/symbiote-$scenario-${{ matrix.sanitizer }}.log" || failed=1
          done
          exit "$failed"
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outputs.cache-primary-key != ''
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-accessibility-${{ matrix.sanitizer }}-logs
          include-hidden-files: true
          path: |
            .linux-host/symbiote-accessibility-*.log
            .linux-host/symbiote-modal-*.log
            .linux-host/symbiote-refresh-*.log
            .linux-host/symbiote-rust-*-symbols.log
            .linux-host/accessibility-${{ matrix.sanitizer }}-results
            .linux-host/modal-${{ matrix.sanitizer }}-results
            .linux-host/refresh-${{ matrix.sanitizer }}-results
            .linux-host/third_party/skia/out/symbiote-*/args.gn
            .linux-host/third_party/skia/.source-sanitizer.json
            .linux-host/build/lavapipe-tsan/driver.json
            .linux-host/build/lavapipe-tsan/native/meson-logs/meson-log.txt
            .linux-host/build/lavapipe-tsan/native/meson-info/intro-buildoptions.json
          if-no-files-found: ignore
