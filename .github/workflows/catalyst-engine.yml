name: Catalyst host integration

on:
  push:
    branches: [feat/catalyst]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalyst-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'ak5/symbiote-native'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      npm_config_workspace_concurrency: '1'
      BUNDLE_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: nice -n 10 pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify build entrypoints and Catalyst package helpers
        run: nice -n 10 node --test --test-concurrency=1 scripts/build-cli-entrypoints.test.mjs scripts/svelte-prepack.test.mjs scripts/normalize-catalyst-frameworks.test.mjs
      - name: Verify generated Catalyst targets
        run: nice -n 10 pnpm exec vitest run --project default --pool=forks --maxWorkers=1 --no-file-parallelism packages/cli/src/scaffold-catalyst.test.ts packages/cli/src/generate.test.ts
      - name: Build the current package artifacts
        run: nice -n 10 pnpm run prepublish-build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          working-directory: examples/svelte
          bundler-cache: true
      - name: Enable UI testing on the disposable runner
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          sudo xcrun automationmodetool enable-automationmode-without-authentication
      - name: Build and test the packed native Catalyst consumer
        run: nice -n 10 pnpm run check:bundle-isolation
        env:
          SYMBIOTE_CONSUMER_FRAMEWORKS: svelte
          SYMBIOTE_CONSUMER_PLATFORMS: ios
          SYMBIOTE_CONSUMER_CATALYST: '1'
          SYMBIOTE_CATALYST_RESULTS: ${{ runner.temp }}/catalyst-results
          BUNDLE_GEMFILE: ${{ github.workspace }}/examples/svelte/Gemfile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalyst-results
          path: ${{ runner.temp }}/catalyst-results
          if-no-files-found: warn
